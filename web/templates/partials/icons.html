{#
  Sprite ikon inline (gaya heroicons outline). Dipakai lewat macro supaya
  tidak ada request tambahan dan ikon tetap tajam di semua ukuran.
  Ikon dekoratif selalu aria-hidden; tombol yang cuma berisi ikon wajib
  punya aria-label sendiri.
#}
{% macro icon(name, size=18) -%}
<svg
  width="{{ size }}"
  height="{{ size }}"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
{%- if name == "dashboard" -%}
  <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
  <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
  <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
  <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
{%- elif name == "folder" -%}
  <path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h3.8l2 2.5H19a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 19 18.5H5A1.5 1.5 0 0 1 3.5 17z" />
{%- elif name == "note" -%}
  <path d="M14 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8z" />
  <path d="M14 3.5V8h4.5" />
  <path d="M12 12v5M9.5 14.5h5" />
{%- elif name == "wallet" -%}
  <rect x="3" y="6" width="18" height="13" rx="2.5" />
  <path d="M3 10h18" />
  <circle cx="16.5" cy="14.5" r="1" />
{%- elif name == "shield" -%}
  <path d="M12 3.2 19 5.7v5.1c0 4.2-2.9 7.6-7 9.2-4.1-1.6-7-5-7-9.2V5.7z" />
  <path d="m9.2 11.9 1.9 1.9 3.7-3.7" />
{%- elif name == "refresh" -%}
  <path d="M20 12a8 8 0 1 1-2.4-5.7" />
  <path d="M20 4.5V8h-3.5" />
{%- elif name == "alert" -%}
  <path d="M12 4.2 20.5 19.5h-17z" />
  <path d="M12 10v4.2" />
  <path d="M12 17.2h.01" />
{%- elif name == "info" -%}
  <circle cx="12" cy="12" r="8.5" />
  <path d="M12 11v5" />
  <path d="M12 8h.01" />
{%- elif name == "arrow-right" -%}
  <path d="M4.5 12h15" />
  <path d="m13.5 6 6 6-6 6" />
{%- elif name == "check" -%}
  <path d="m5 12.5 4.5 4.5L19 7.5" />
{%- endif -%}
</svg>
{%- endmacro %}
